name: ESP32 firmware build

on:
  push:
    branches: [esp32-port]
    paths:
      - "esp32/**"
      - ".github/workflows/esp32-build.yml"
  pull_request:
    paths:
      - "esp32/**"
      - ".github/workflows/esp32-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Create compile-time secrets header
        working-directory: esp32
        run: cp src/secrets.example.h src/secrets.h
      - name: Compile ESP32 firmware
        working-directory: esp32
        run: pio run
